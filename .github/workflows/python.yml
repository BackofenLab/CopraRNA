name: Python migration
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            biopython: '1.84'
          - python: '3.12'
            biopython: '1.86'
          - python: '3.13'
            biopython: '1.86'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,build]' 'biopython==${{ matrix.biopython }}'
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installed wheel outside the source directory
        shell: bash
        run: |
          python -m venv --system-site-packages /tmp/coprarna-wheel
          /tmp/coprarna-wheel/bin/python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          /tmp/coprarna-wheel/bin/coprarna --version
          /tmp/coprarna-wheel/bin/coprarna status
          /tmp/coprarna-wheel/bin/coprarna helper archive-readme
