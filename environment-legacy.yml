# Oracle environment only. Never a dependency of the Python implementation.
name: coprarna-legacy-oracle
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - perl=5.26.2
  - perl-bioperl=1.7.8
  - perl-bio-eutilities
  - perl-getopt-long
  - perl-list-moreutils
  - perl-parallel-forkmanager
  - r-base=3.6.3
  - r-pheatmap=1.0.12
  - r-robustrankaggreg=1.1
  - r-seqinr
