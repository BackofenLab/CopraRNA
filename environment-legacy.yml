# Optional Perl helper oracle only; never a production dependency.
# Native workflow validation uses environment.yml (IntaRNA >=3).
name: coprarna-legacy-oracle
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - perl=5.32.1
  - perl-bioperl=1.7.8
  - perl-bio-eutilities
  - perl-getopt-long
  - perl-list-moreutils
  - perl-parallel-forkmanager
# Keep the R oracle separate: old BioPerl XML libraries conflict with current R.
# See environment-legacy-r.yml and README.2.md.
