  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - perl=5.26.2
  - perl-bioperl=1.7.8
  - perl-bio-eutilities
  - perl-getopt-long
  - perl-list-moreutils
  - perl-parallel-forkmanager
  - r-base=3.6.3
  - r-pheatmap=1.0.12
  - r-robustrankaggreg=1.1
  - r-seqinr
  - blast-legacy=2.2.26
  - domclust=1.2.8
  - emboss=6.6.0
  - embassy-phylip=3.69.650
  - intarna=2.2.0
  - mafft=7.310
  - clustalo=1.2.3
  - phantomjs=2.1.1
