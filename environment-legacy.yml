# CopraRNA2 helper-oracle interpreters only; never production dependencies.
# Native workflow validation uses environment.yml (IntaRNA >=3).
name: coprarna-legacy-oracle
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - perl=5.32.1
  - perl-bioperl=1.7.8
  - perl-bio-eutilities
  - perl-getopt-long
  - perl-list-moreutils
  - perl-parallel-forkmanager
  - r-base=4.4.3
# Install the captured helper oracle's pure-R dependency after activation:
# Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/RobustRankAggreg/RobustRankAggreg_1.1.tar.gz", repos=NULL, type="source")'
# Conda's old 1.1 builds pin incompatible R ABIs; the archived source works on R 4.4.3.
